<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass</title>
</head>
<body>
    <form action-"" name="registration form">
        <label for="first name">First name</label>
        <input type="text" id="first name"  placeholder="Ayush">
        <br>
        <label for="Last name">Last name</label>
        <input type="text" id="last name" placeholder="xyz">
          <br>
        <label for="email">Email</label>     
        <input type="email" id="email">
         <br>
        <label for="phone">Phone number</label>     
        <input type="tel" id="phone" placeholder="000">   
        <br>
        <label for="dob">Date of birth</label>     
        <input type="date" id="dob" >    
        <br>
        <label for="stream">Stream</label>
        <select name="stream" id="stream">
            <option value="science">PCM</option>
            <option value="science">PCB</option>
            <option value="arts">sst</option>
            <option value="commerce">xy</option>
    </select>
     <br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender"> 
         <label for="female">Female</label>
        <input type="radio" id="female" name="gender"> 
         <br>
        <label for="obc">OBC</label>
        <input type="checkbox" id="obc"> 
        <label for="general">GENERAL</label>
        <input type="checkbox" id="general"> 
         <br>
        <label for="password">Password</label>
        <input type="password" id="password"> 
        <br>
        
        <input type="submit" id="submit">
        
        



    </form>
</body>
</html>
